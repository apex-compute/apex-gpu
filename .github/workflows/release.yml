name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v1.0.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check checksums
        run: |
          (cd image && sha256sum -c SHA256SUMS)
      - name: Package
        env:
          TAG: ${{ inputs.tag }}
        run: |
          name=apex-gpu-k7-$TAG
          mkdir -p dist/$name
          cp -r README.md FLASH.md requirements.txt LICENSE driver tools image media dist/$name/
          tar -C dist -czf dist/$name.tar.gz $name
          (cd dist && sha256sum $name.tar.gz > $name.tar.gz.sha256)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "$TAG" --generate-notes \
            dist/*.tar.gz dist/*.sha256 image/gpu_k7_flash.bin

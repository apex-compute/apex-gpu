name: CI auto-retry

# Re-runs CI jobs that died because their self-hosted runner went away --
# bootcamp (the lab host every self-hosted runner of this repo lives on)
# rebooted, lost power or restarted its runner service -- rather than because
# the build or test failed. GitHub cannot reconnect a job to a restarted
# runner, so every job in flight fails with "lost communication".
#
# Every 15 min, and on a manual run, this sweeps the repo's failed or cancelled
# runs from the last 24 h, of every workflow, and re-runs a run's failed jobs
# (rerun-failed-jobs, same run id) when GitHub's own annotation says a job's
# self-hosted runner was lost. A red build, a test failure, a timeout or a
# manual cancel is never re-run, and no run gets more than 3 attempts.
#
# This job runs on bootcamp too, so a scheduled sweep only does its API work
# within 2 h of a runner process starting there; otherwise it returns at once.
# While bootcamp is down this job just queues and runs when it is back.
#
# Same sweep as apex-compute/andromeda's ci-auto-retry.yml.
# GitHub starts schedule workflows only from the default branch's copy.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: read

concurrency:
  group: ci-auto-retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: [self-hosted, apex-gpu-k7]
    timeout-minutes: 30
    steps:
      - name: Re-run jobs lost to a runner shutdown
        uses: actions/github-script@v7
        with:
          script: |
            const common = { owner: context.repo.owner, repo: context.repo.repo };
            const MAX_ATTEMPTS = 3;
            const LOST = /runner has received a shutdown signal|lost communication with the server/i;
            const SWEEP_HOURS = 24;
            const RECENT_RESTART_HOURS = 2;

            if (context.eventName === "schedule") {
              let youngest = Infinity;
              try {
                const out = require("child_process")
                  .execSync("ps -o etimes= -C Runner.Listener", { encoding: "utf8" });
                for (const s of out.split(/\s+/).filter(Boolean)) youngest = Math.min(youngest, Number(s));
              } catch (error) {
                youngest = 0; // cannot tell: sweep
              }
              if (youngest > RECENT_RESTART_HOURS * 3600) {
                core.info(`No runner on this host started in the last ${RECENT_RESTART_HOURS} h (youngest ${Math.round(youngest / 3600)} h); nothing to sweep`);
                return;
              }
              core.info(`A runner on this host started ${Math.round(youngest / 60)} min ago; sweeping`);
            }

            async function retryIfLost(run) {
              const where = `${run.name} run ${run.id} attempt ${run.run_attempt} (${run.html_url})`;
              const jobs = await github.paginate(
                github.rest.actions.listJobsForWorkflowRunAttempt,
                { ...common, run_id: run.id, attempt_number: run.run_attempt, per_page: 100 }
              );
              const lost = [];
              for (const job of jobs) {
                if (!["failure", "cancelled"].includes(job.conclusion)) continue;
                // Only self-hosted jobs: a lost GitHub-hosted VM is not bootcamp's.
                if (!(job.labels || []).includes("self-hosted")) continue;
                const annotations = await github.paginate(
                  "GET /repos/{owner}/{repo}/check-runs/{check_run_id}/annotations",
                  { ...common, check_run_id: job.id, per_page: 100 }
                );
                const why = annotations.map(a => a.message).find(m => LOST.test(m || ""));
                core.info(`${where}: ${job.name} on ${job.runner_name || "?"}: ${job.conclusion}${why ? ` -- ${why}` : ""}`);
                if (why) lost.push(job.name);
              }
              if (!lost.length) return false;
              if (run.run_attempt >= MAX_ATTEMPTS) {
                core.warning(`${where}: ${lost.join(", ")} lost to a runner shutdown again; not re-running after ${MAX_ATTEMPTS} attempts`);
                return false;
              }
              try {
                await github.request(
                  "POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun-failed-jobs",
                  { ...common, run_id: run.id }
                );
              } catch (error) {
                core.info(`${where}: re-run not accepted (${error}); someone re-ran it already`);
                return false;
              }
              core.notice(`${where}: re-ran ${lost.join(", ")} (lost to a runner shutdown)`);
              return true;
            }

            const since = new Date(Date.now() - SWEEP_HOURS * 3600 * 1000).toISOString();
            let checked = 0;
            let rerun = 0;
            for (const status of ["failure", "cancelled"]) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                { ...common, status, created: `>=${since}`, per_page: 100 }
              );
              for (const run of runs) {
                if (run.status !== "completed") continue;
                if (run.path && run.path.endsWith("/ci-auto-retry.yml")) continue;
                checked++;
                if (await retryIfLost(run)) rerun++;
              }
            }
            core.info(`Sweep of the last ${SWEEP_HOURS} h: ${checked} failed/cancelled run(s) checked, ${rerun} re-run`);
